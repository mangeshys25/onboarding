// ---------- HELPERS ----------
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function isDelete(e) { return e && e.inputType && e.inputType.indexOf('delete') === 0; }

function fmtSSN(v, trail) {
  var d = v.replace(/\D/g, '').slice(0, 9);
  var out = d.slice(0, 3);
  if (d.length > 3) out += '-' + d.slice(3, 5);
  if (d.length > 5) out += '-' + d.slice(5);
  if (trail && (d.length === 3 || d.length === 5)) out += '-';
  return out;
}

function fmtDOB(v, trail) {
  var d = v.replace(/\D/g, '').slice(0, 8);
  var out = d.slice(0, 4);
  if (d.length > 4) out += '-' + d.slice(4, 6);
  if (d.length > 6) out += '-' + d.slice(6, 8);
  if (trail && (d.length === 4 || d.length === 6)) out += '-';
  return out;
}

// Returns the date as YYYY-MM-DD, or null if invalid
function parseDOB(t) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if (!m) return null;
  var y = +m[1], a = +m[2], b = +m[3];
  var mo = DOB_DAY_FIRST ? b : a;
  var d  = DOB_DAY_FIRST ? a : b;
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  if (y < 1900 || dt > new Date()) return null;
  return y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2);
}
// True if the date (YYYY-MM-DD) is at least MIN_AGE years before today
function isAdult(iso) {
  var d = new Date();
  var cutoff = (d.getFullYear() - MIN_AGE) + '-' +
               ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
               ('0' + d.getDate()).slice(-2);
  return iso <= cutoff;
}
// DD-MM-YYYY auto-formatting (adds the dashes while typing)
function fmtDMY(v, trail) {
  var d = v.replace(/\D/g, '').slice(0, 8);
  var out = d.slice(0, 2);
  if (d.length > 2) out += '-' + d.slice(2, 4);
  if (d.length > 4) out += '-' + d.slice(4, 8);
  if (trail && (d.length === 2 || d.length === 4)) out += '-';
  return out;
}

// Reads DD-MM-YYYY and returns YYYY-MM-DD, or null if it is not a real date
function parseDMY(t) {
  var m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(t);
  if (!m) return null;
  var d = +m[1], mo = +m[2], y = +m[3];
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  if (y < 1900) return null;
  return y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2);
}
function fmtEIN(v, trail) {

  .wrap h1 { font-size:22px; color:#0b1f5c; }
  .wrap h2 { margin:0 0 4px; font-size:22px; color:#0b1f5c; }
  .wrap label { color:#1b2a55; }
  .wrap input, .wrap select, .wrap textarea { border:1.5px solid #d3daea; border-radius:12px; padding:12px; background:#fbfcff; }
  .wrap input.auto { background:#eef1f8; }
  .wrap input:focus, .wrap select:focus, .wrap textarea:focus { outline:none; border-color:#12a5b5; box-shadow:0 0 0 3px rgba(18,165,181,.2); }
  .wrap button { background:linear-gradient(90deg,#1747d1,#0aa5b8); border-radius:12px; font-weight:600;
          box-shadow:0 8px 20px rgba(23,71,209,.3); transition:transform .15s, box-shadow .15s; }
  .wrap button:hover { transform:translateY(-1px); }
  .wrap button:disabled { background:#9aa5b8; box-shadow:none; transform:none; }
  .wrap .linkbtn { background:none; box-shadow:none; color:#1747d1; width:auto; margin:0; padding:0; font-size:14px; font-weight:600; }
  .wrap .linkbtn:hover { transform:none; text-decoration:underline; }

  /* ---------- Start screen ---------- */
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px; }
  @media (max-width:640px) { .opts { grid-template-columns:1fr; } }
  .wrap .opt { position:relative; margin:0; padding:20px; text-align:left; color:#0b1f5c; background:#f4f7ff;
          border:1.5px solid #d6e0ff; box-shadow:none; display:flex; flex-direction:column; gap:6px; width:auto; }
  .wrap .opt:hover { border-color:#1747d1; box-shadow:0 10px 24px rgba(23,71,209,.18); }
  .opt .ico { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#fff;
          background:linear-gradient(135deg,#1747d1,#0aa5b8); }
  .opt b { font-size:16px; } .opt small { color:#51608a; font-size:13px; line-height:1.4; font-weight:400; }
  .opt em { position:absolute; top:12px; right:12px; font-style:normal; font-size:10px; color:#067a6f;
          background:#d9fbf6; padding:3px 8px; border-radius:10px; }

  /* ---------- Chat ---------- */
  .chead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .who { display:flex; align-items:center; gap:10px; }
  .who b { display:block; color:#0b1f5c; font-size:15px; } .who small { color:#12a56a; font-size:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px;
          background:linear-gradient(135deg,#5b6cff,#19d3c5); }
  .wrap .vbtn { margin:0; width:auto; padding:8px 12px; font-size:12px; display:flex; align-items:center; gap:6px;
          background:#eef2ff; color:#1747d1; box-shadow:none; border:1px solid #cbd6ff; }
  .wrap .vbtn.on { background:#d9fbf6; color:#067a6f; border-color:#8fe7dc; }
  #chatBox { height:min(440px,58vh); overflow-y:auto; border-radius:16px; padding:14px;
          background:linear-gradient(180deg,#f6f8ff,#eef3fb); border:1px solid #dfe6f5; }
  .b { max-width:84%; padding:10px 14px; margin:7px 0; border-radius:16px; font-size:14px;
       white-space:pre-line; line-height:1.45; word-wrap:break-word; }
  .bot { background:#fff; color:#1b2430; border-bottom-left-radius:4px; box-shadow:0 2px 8px rgba(20,40,100,.08); }
  .me  { background:linear-gradient(90deg,#1747d1,#0aa5b8); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot.bad { background:#fdeaea; color:#a12121; }
  #quick { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .wrap #quick button { width:auto; margin:0; padding:9px 16px; font-size:13px; background:#fff; color:#1747d1;
          border:1.5px solid #1747d1; border-radius:20px; box-shadow:none; }
  .wrap #quick button:hover { background:#1747d1; color:#fff; }
  #chatRow { display:flex; gap:8px; margin-top:12px; align-items:center; }
  #chatRow input { flex:1; }
  .wrap #chatRow button { width:auto; margin:0; padding:0 20px; height:46px; }
  .wrap .mic { width:46px; padding:0; display:grid; place-items:center; background:#eef2ff; color:#1747d1;
          border:1px solid #cbd6ff; border-radius:50%; box-shadow:none; }
  .wrap .mic.on { background:#e5384d; color:#fff; border-color:#e5384d; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(229,56,77,.5); } 100% { box-shadow:0 0 0 14px rgba(229,56,77,0); } }
  /* ---------- Virtual assistant (the lady) ---------- */
  .agent { display:flex; align-items:center; gap:16px; padding:14px 18px; margin-bottom:12px; border-radius:18px;
           background:linear-gradient(135deg,#eaf1ff,#e0f7f4); border:1px solid #d6e3fb; transition:box-shadow .3s; }
  .agent.speak { box-shadow:0 0 0 3px rgba(23,71,209,.25); }
  .agent.listen { box-shadow:0 0 0 3px rgba(18,165,106,.5); }
  .agent.think { box-shadow:0 0 0 3px rgba(224,160,30,.45); }
  .avwrap { width:104px; height:104px; border-radius:50%; overflow:hidden; flex:none;
            background:linear-gradient(160deg,#cfe0ff,#c9f3ee); box-shadow:0 6px 18px rgba(23,50,120,.2);
            animation:floaty 5s ease-in-out infinite; }
  .avwrap svg { width:100%; height:100%; display:block; }
  @keyframes floaty { 50% { transform:translateY(-3px); } }
  .ainfo b { display:block; font-size:18px; color:#0b1f5c; }
  .ainfo span { display:block; font-size:13px; color:#51608a; margin-top:2px; }
  .ainfo small { display:block; margin-top:6px; font-size:12px; color:#12a56a; }
  #av .eyes { animation:blink 4.2s infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes blink { 0%,93%,100% { transform:scaleY(1); } 96% { transform:scaleY(.08); } }
  #av .mopen { display:none; transform-box:fill-box; transform-origin:center; }
  #av.talking .smile { display:none; }
  #av.talking .mopen { display:block; animation:talk .3s infinite alternate; }
  @keyframes talk { from { transform:scaleY(.2); } to { transform:scaleY(1); } }
  @media (prefers-reduced-motion:reduce) { .avwrap, #av .eyes { animation:none; } }
</style>

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function setStat(t, mode) { stat.textContent = '\u25CF ' + t; panel.className = 'agent ' + (mode || ''); }
  function talkFor(ms) {
    av.classList.add('talking'); clearTimeout(tt);
    tt = setTimeout(function () { if (!speaking) av.classList.remove('talking'); }, ms);
  }
  function note(t) { say(t, 'bot', false); }   // shown, never spoken

  // Pick a female voice (Neerja, Heera, Zira, Samantha, Google UK English Female ...)
  function pickVoice() {
    var vs = synth ? synth.getVoices() : [];
    if (!vs.length) return null;
    var fem = /female|neerja|heera|veena|zira|samantha|susan|hazel|aria|jenny|karen|tessa|moira|fiona|libby|sonia|natasha|catherine/i;
    var lang = VOICE_LANG.toLowerCase(), base = lang.slice(0, 2);
    function first(f) { return vs.filter(f)[0]; }
    return first(function (v) { return v.lang.toLowerCase() === lang && fem.test(v.name); }) ||
           first(function (v) { return v.lang.toLowerCase().indexOf(base) === 0 && fem.test(v.name); }) ||
           first(function (v) { return v.lang.toLowerCase() === lang; }) ||
           first(function (v) { return v.lang.toLowerCase().indexOf(base) === 0; }) || null;
  }
  if (synth) { lady = pickVoice(); synth.onvoiceschanged = function () { lady = pickVoice(); }; }

  function speak(text) {
  if (!voiceOn || !synth || !text) return;
  if ($('chatMode').style.display === 'none') return;   // never speak outside the chat page
    var t = String(text).replace(/,?\s*for example [^.\n]*/gi, '')
      .replace(/\d[\d\s-]{4,}\d/g, 'the number shown on screen')
      .replace(/[\u2022\u25CF]+/g, '').replace(/\n+/g, '. ');
    var u = new SpeechSynthesisUtterance(t);
    var v = lady || pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = VOICE_LANG; }
    u.pitch = 1.05;
    speaking++;
    u.onstart = function () { av.classList.add('talking'); setStat('Speaking...', 'speak'); };
    u.onend = u.onerror = function () {
      speaking = Math.max(0, speaking - 1);
      if (!speaking) { av.classList.remove('talking'); setStat('Online', ''); afterSpeech(); }
    };
    synth.speak(u);
  }

  function canAnswer() {
    if (busy || recording) return false;
    if (cur && cur.type === 'file') return false;
    return !!cur || quick.children.length > 0;
  }
  function afterSpeech() {
  if ($('chatMode').style.display === 'none') return;   // do not listen outside the chat page
  if (voiceOn && !noAuto && canAnswer()) listen();
}

  function setListenUI(on) {
    listening = on;

    else if (!speaking && !busy) setStat('Online', '');
  }
  function micFail(msg) { noAuto = true; setListenUI(false); bad(msg); }

  function listen() {
    if (listening || recording || busy) return;
    if (useRecorder) recListen(); else webListen();
  }

  // Method 1: the browser's own speech recognition
  function webListen() {
    var r;
    try { r = new SR(); } catch (e) { useRecorder = true; recListen(); return; }
    rec = r;
    r.lang = VOICE_LANG; r.interimResults = false; r.maxAlternatives = 1;
    r.onstart = function () { setListenUI(true); };
    r.onresult = function (e) { onVoice(e.results[0][0].transcript.trim()); };
    r.onerror = function (e) {
      var c = e.error;
      if (c === 'aborted') return;
      if (c === 'no-speech') { noAuto = true; note('I did not hear anything. Tap the mic and speak again.'); return; }
      // Speech service not usable here: switch to the recorder method
      useRecorder = true; setListenUI(false);
      note('The browser voice service did not work (' + c + '). Switching to another method...');
      setTimeout(recListen, 250);
    };
    r.onend = function () { if (!recording) setListenUI(false); };
    try { r.start(); } catch (e) {}
  }

  // Method 2: record the voice and let Gemini convert it to text (works in any browser with a microphone)
  var rctx = null, rstream = null, rproc = null, rchunks = [];
  function recListen() {
    if (recording) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micFail('This browser cannot use the microphone on this page. Please type or tap your answers.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var AC = window.AudioContext || window.webkitAudioContext;
      rctx = new AC(); rstream = stream;
      var src = rctx.createMediaStreamSource(stream);
      rproc = rctx.createScriptProcessor(4096, 1, 1);
      rchunks = []; recording = true; setListenUI(true);
      var started = false, quiet = 0, total = 0, ms = 4096 / rctx.sampleRate * 1000;
      rproc.onaudioprocess = function (ev) {
        var d = ev.inputBuffer.getChannelData(0);
        rchunks.push(new Float32Array(d));
        var sum = 0; for (var i = 0; i < d.length; i++) sum += d[i] * d[i];
        total += ms;
        if (Math.sqrt(sum / d.length) > 0.02) { started = true; quiet = 0; } else if (started) { quiet += ms; }
        if ((started && quiet > 1300) || total > 9000 || (!started && total > 6000)) finishRec(started);
      };
      src.connect(rproc); rproc.connect(rctx.destination);
    }).catch(function (e) {
      micFail('The browser did not give microphone access (' + (e && e.name ? e.name : 'error') + '). ' +
        'Click the lock icon next to the page address, set Microphone to Allow, reload the page and try again. You can keep typing meanwhile.');
    });
  }

  function releaseRec() {
    recording = false;
    try { rproc.disconnect(); } catch (e) {}
    try { rstream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { rctx.close(); } catch (e) {}
  }

  function finishRec(started) {
    if (!recording) return;
    var rate = rctx.sampleRate;
    releaseRec(); setListenUI(false);
    if (!started) { noAuto = true; note('I did not hear anything. Tap the mic and speak again.'); return; }
    var wav = toWav(rchunks, rate);

      .withSuccessHandler(function (r) {

      })
      .withFailureHandler(function (e) {
        busy = false; setStat('Online', '');

  // Recorded audio -> 16 kHz mono WAV (base64)
  function toWav(chunks, rate) {
    var n = 0; chunks.forEach(function (c) { n += c.length; });
    var all = new Float32Array(n), o = 0;
    chunks.forEach(function (c) { all.set(c, o); o += c.length; });
    var ratio = rate / 16000, len = Math.floor(n / ratio), pcm = new Int16Array(len);
    for (var i = 0; i < len; i++) {
      var from = Math.floor(i * ratio), to = Math.max(from + 1, Math.floor((i + 1) * ratio)), sum = 0;
      for (var k = from; k < to && k < n; k++) sum += all[k];
      var x = Math.max(-1, Math.min(1, sum / (to - from)));
      pcm[i] = x < 0 ? x * 0x8000 : x * 0x7FFF;

      .withSuccessHandler(done)
      .withFailureHandler(function (e) {
        busy = false;
        bad('Error: ' + e.message);
        buttons([{ t: 'Try again', f: submit }]);
      })
      .submitForm(out);
  }

  function mapIds(items) {
    var out = [];
    items.forEach(function (it) {
      var ids = (it.fieldId === 'state' || it.fieldId === 'city') ? ['addr1', 'addr2', 'zip'] : [it.fieldId];
      ids.forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); });
    });
    return out;
  }

  // ================= CAMERA SCAN (hold the document up to the camera) =================
  var BLUR_MIN = 30;   // soft warning only; raise it to be stricter
  var camStream = null, camField = null, camShot = null, camTimer = null;

  function camUI() {
    if ($('camModal')) return;
    document.body.insertAdjacentHTML('beforeend',
      '<div id="camModal"><div class="camcard"><div class="camtitle" id="camTitle"></div>' +
      '<div class="camview"><video id="camVideo" autoplay playsinline muted></video>' +
      '<img id="camShotImg" alt="" style="display:none"><div class="camguide" id="camGuide"></div><div id="camCount"></div></div>' +
      '<div class="camhint" id="camHint"></div><div class="camrow" id="camRow"></div></div></div>');
  }
  function camButtons(list) {
    var row = $('camRow'); row.innerHTML = '';
    list.forEach(function (it) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = it.t; b.onclick = it.f; row.appendChild(b);
    });
  }
  function camLive() {
    $('camShotImg').style.display = 'none';
    $('camVideo').style.display = 'block';
    $('camGuide').style.display = camField.selfie ? 'none' : 'block';
    $('camHint').textContent = camField.selfie
      ? 'Look straight at the camera in good light.'
      : 'Hold the document flat inside the frame. Keep all four corners visible and avoid glare.';
    camButtons([
      { t: 'Capture in 3 seconds', f: countdown },
      { t: 'Capture now', f: snap },
      { t: 'Cancel', f: closeCamera }
    ]);
  }
  function openCamera(f) {
    camUI(); camField = f;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      bad('This page cannot use the camera. Please open the website from its https address in Chrome, Edge or Safari, or attach a file instead.');
      return;
    }
    stopVoice();
    $('camTitle').textContent = f.selfie ? 'Take a selfie' : 'Scan: ' + short(f);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: f.selfie ? 'user' : 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(function (s) {
        camStream = s;
        $('camVideo').srcObject = s;
        $('camModal').style.display = 'flex';
        camLive();
      })
      .catch(function (e) {
        bad('The camera is not available (' + (e && e.name ? e.name : 'error') + '). Click the lock icon next to the page address, set Camera to Allow, then reload. You can also attach a file instead.');
      });
  }
  function closeCamera() {
    if (camTimer) { clearInterval(camTimer); camTimer = null; }
    $('camCount').textContent = '';
    if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
    $('camModal').style.display = 'none';
  }
  function countdown() {
    var n = 3, c = $('camCount');
    camButtons([{ t: 'Cancel', f: closeCamera }]);
    c.textContent = n;
    camTimer = setInterval(function () {
      n--;
      if (n > 0) c.textContent = n;
      else { clearInterval(camTimer); camTimer = null; c.textContent = ''; snap(); }
    }, 1000);
  }
  function sharpness(cv) {
    var w = 320, h = Math.max(2, Math.round(cv.height * w / cv.width));
    var t = document.createElement('canvas'); t.width = w; t.height = h;
    var x = t.getContext('2d'); x.drawImage(cv, 0, 0, w, h);
    var d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h), i;
    for (i = 0; i < w * h; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    var sum = 0, sq = 0, n = 0;
    for (var yy = 1; yy < h - 1; yy++) for (var xx = 1; xx < w - 1; xx++) {
      var k = yy * w + xx, l = 4 * g[k] - g[k - 1] - g[k + 1] - g[k - w] - g[k + w];
      sum += l; sq += l * l; n++;
    }
    var mean = sum / n; return sq / n - mean * mean;
  }
  function snap() {
    var v = $('camVideo');
    if (!v.videoWidth) return;
    var scale = Math.min(1, 1600 / v.videoWidth);
    var cv = document.createElement('canvas');
    cv.width = Math.round(v.videoWidth * scale); cv.height = Math.round(v.videoHeight * scale);
    cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
    camShot = cv.toDataURL('image/jpeg', 0.85);
    $('camShotImg').src = camShot;
    $('camShotImg').style.display = 'block'; v.style.display = 'none'; $('camGuide').style.display = 'none';
    $('camHint').textContent = sharpness(cv) < BLUR_MIN
      ? 'This photo looks blurry. Please retake it and hold steady.'
      : 'Is the photo clear, with everything visible?';
    camButtons([{ t: 'Use this photo', f: useShot }, { t: 'Retake', f: camLive }]);
  }
  function useShot() {
    var f = camField, b64 = camShot.split(',')[1];
    if (b64.length * 0.75 > MAX_MB * 1024 * 1024) { bad('That photo is too large. Please retake it.'); return; }
    ans[f.id] = { base64: b64, mimeType: 'image/jpeg', name: f.id + '-scan.jpg' };
    closeCamera(); quick.innerHTML = '';
    say('Captured: ' + short(f), 'me');
    next();
  }
    // ---- Phone number in the chat ----
  var PREFER = ['United States', 'India', 'Russia', 'Italy', 'Australia'];
  var DIAL_ALIAS = { usa: 'United States', us: 'United States', america: 'United States', uk: 'United Kingdom', britain: 'United Kingdom', england: 'United Kingdom', uae: 'United Arab Emirates', emirates: 'United Arab Emirates' };
  function findDial(t) {
    var q = t.toLowerCase().replace(/[().,]/g, ' ').replace(/\s+/g, ' ').trim(), i;
    if (DIAL_ALIAS[q]) return DIAL_ALIAS[q];
    var m = /^\+?(\d{1,4})$/.exec(q);
    if (m) {
      for (i = 0; i < PREFER.length; i++) if (DIAL[PREFER[i]] === m[1]) return PREFER[i];
      for (i = 0; i < COUNTRIES.length; i++) if (DIAL[COUNTRIES[i]] === m[1]) return COUNTRIES[i];
      return null;
    }
    var name = q.replace(/\+?\d+/g, '').replace(/\s+/g, ' ').trim();
    var exact = COUNTRIES.filter(function (c) { return c.toLowerCase() === name; });
    if (exact.length) return exact[0];
    var part = COUNTRIES.filter(function (c) { return name.length > 2 && c.toLowerCase().indexOf(name) > -1; });
    return part.length === 1 ? part[0] : null;
  }
  function phoneHandle(f, t) {
        if (f.usOnly) {
      var d = t.replace(/\D/g, '');
      if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
      var e = phoneError('United States', d);
      if (e) return bad(e);
      ans[f.id] = '+1 ' + d; phoneCC = '';
      next(); return;
    }
    if (!phoneCC) {
      var full = /^\+(\d{1,4})[\s-]*([\d\s-]{6,16})$/.exec(t.trim());
      var c = full ? findDial('+' + full[1]) : findDial(t);
      if (!c) return bad('I could not find that country code. Try the country name, like India, or the code, like +91.');
      phoneCC = c; quick.innerHTML = '';
      if (!full) { say('Country code +' + DIAL[c] + ' selected. Now type or say the number, without the country code.'); return; }
      t = full[2];
    }
    var digits = t.replace(/\D/g, ''), err = phoneError(phoneCC, digits);
    if (err) return bad(err);
    ans[f.id] = '+' + DIAL[phoneCC] + ' ' + digits;
    phoneCC = '';
    next();
  }
    // ================= OPEN ACCOUNT WITH AI (live capture) =================
  var PEP_STEPS = ['pep', 'pepname', 'peptype', 'pepprimary', 'pepsecondary', 'peptertiary'];
  var AI_FLOW = {
    'Retail': ['phone', 'email', 'selfie', 'ssnproof', 'poa', 'occ'].concat(PEP_STEPS,
              ['@extract', 'name', 'dob', 'addr1', 'addr2', 'zip', 'city', 'state', 'ssn']),
    'Business': ['phone', 'email', 'cp575', 'coe', 'ubo', '@extract', 'bname', 'lei', 'ein'],
    'Foreign National': ['phone', 'email', 'selfie', 'ppcopy', 'visacopy', '@extract', 'fname', 'dob', 'nat',
              'ppno', 'ppexp', 'visatype', 'visano', 'visaexp', 'oaddress', 'alias'].concat(PEP_STEPS)
  };

  function nextAI() {
    var order = AI_FLOW[type];
    for (var i = 0; i < order.length; i++) {
      var id = order[i];
      if (id === '@extract') { if (!extracted) { extract(); return; } continue; }
      var f = byId(id);
      if (!f) continue;
      if (!vis(f)) { delete ans[f.id]; continue; }
      if (f.id in ans) continue;
      if (f.type === 'file') { ask(f); return; }
      if (f.id === 'addr1' && !manual.addr1 && addrOk()) { confirmAddress(); return; }
      var c = cand[f.id];
      if (EX.indexOf(f.id) > -1 && ADDR.indexOf(f.id) < 0 && !manual[f.id]) {
        if (c) {
          var r = check(f, c, true);
          if (!r.err) { confirmField(f, r.v); return; }
          bad('I read "' + showVal(f, c) + '" for ' + short(f) + ', but: ' + r.err);
        }
        ask(f, 'I could not read this from your documents.\n');
        return;
      }
      ask(f);
      return;
    }
    if (pending.length) { say('Is there anything else to fix?'); hub(pending); }
    else confirmStep();
  }
  function done(res) {
    busy = false;
    if (res.saved) {
      say('Thank you! Your application was verified and submitted.\nReference: ' + res.ref +
          '\n\nTo start a new application, refresh this page.', 'bot',
          'Thank you! Your application was verified and submitted. Your reference number is shown on screen.');
      quick.innerHTML = '';
      inp.disabled = true; $('chatSend').disabled = true;
      return;
    }
    var items = (res.items || []).filter(function (i) { return !i.ok; });
    if (!items.length) {
      bad(res.text || 'Something went wrong.');
      buttons([{ t: 'Try again', f: submit }]);
      return;
    }
    say('Your application was NOT submitted. Please check these items:', 'bad');
    items.forEach(function (i) {
      var f = byId(i.fieldId);
      say((f ? short(f) : i.fieldId) + ': ' + i.text, 'bad', short(f || { label: i.fieldId }) + ' needs attention. Please see the details on screen.');
    });
    pending = mapIds(items);
    say('If a detail is correct, the document may be unclear. Use "Change something else" to upload it again.');
    hub(pending);
  }
})();
</script>
